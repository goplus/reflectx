name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test-MacOS:
    strategy:
      matrix:
        go-version: [1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x]
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Test-linkname
      if: ${{ matrix.go-version >= '1.23' }}
      run: go test -race -v -tags linknamefix -ldflags="-checklinkname=0"

  Test-Linux:
    strategy:
      matrix:
        go-version: [1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Test-linkname
      if: ${{ matrix.go-version >= '1.23' }}
      run: go test -race -v -tags linknamefix -ldflags="-checklinkname=0"

    - name: Test-386
      run: GOARCH=386 go test -v .

  Test-Windows:
    strategy:
      matrix:
        go-version: [1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Test-386
      run: |
        set GOARCH=386 
        go test -v .
