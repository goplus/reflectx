name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test-MacOS:
    strategy:
      matrix:
        go-version: [1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x, 1.27.x]
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Build-linkname
      if: ${{ matrix.go-version >= '1.23' }}
      run: go build -tags linknamefix -ldflags=-checklinkname=0 -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Test-linkname
      if: ${{ matrix.go-version >= '1.23' }}
      run: go test -race -v -tags linknamefix -ldflags="-checklinkname=0"

  Test-Linux:
    strategy:
      matrix:
        go-version: [1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x, 1.27.x]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Build-linkname
      if: ${{ matrix.go-version >= '1.23' }}
      run: go build -tags linknamefix -ldflags=-checklinkname=0 -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Test-linkname
      if: ${{ matrix.go-version >= '1.23' }}
      run: go test -race -v -tags linknamefix -ldflags="-checklinkname=0"

    - name: Test-386
      run: GOARCH=386 go test -v .

    - name: Install wasmtime
      uses: taiki-e/install-action@v2
      with:
        tool: wasmtime

    - name: Test-wasip1
      run: GOOS=wasip1 GOARCH=wasm go test -exec wasmtime -v .

  Test-Wasm-IfaceFuncval:
    strategy:
      matrix:
        go-tag: [go1.26.8, go1.27.1]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'

    - name: Install wasmtime
      uses: taiki-e/install-action@v2
      with:
        tool: wasmtime

    - name: Test iface_patch
      run: go test -v ./cmd/iface_patch

    - name: Clone Go ${{ matrix.go-tag }}
      run: git clone --depth 1 --branch ${{ matrix.go-tag }} https://github.com/golang/go.git "$HOME/${{ matrix.go-tag }}"

    - name: Patch Go
      run: |
        go run ./cmd/iface_patch "$HOME/${{ matrix.go-tag }}"
        go run ./cmd/iface_patch -check "$HOME/${{ matrix.go-tag }}"

    - name: Rebuild Go
      run: cd "$HOME/${{ matrix.go-tag }}/src" && ./make.bash

    - name: Test-wasip1-ifacefuncval
      run: |
        export GOROOT="$HOME/${{ matrix.go-tag }}"
        export PATH="$GOROOT/bin:$PATH"
        GOOS=wasip1 GOARCH=wasm go test -exec wasmtime -v -tags goplus.ifacefuncval .
        # Skip Examples: bare wasmtime has no /tmp preopen (Example stdout files fail).
        GOOS=wasip1 GOARCH=wasm go test -exec wasmtime -v -tags goplus.ifacefuncval -run '^Test' fmt sort

  Test-Native-IfaceFuncval:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        go-tag: [go1.26.8, go1.27.1]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'

    - name: Test iface_patch
      run: go test -v ./cmd/iface_patch

    - name: Clone Go ${{ matrix.go-tag }}
      run: git clone --depth 1 --branch ${{ matrix.go-tag }} https://github.com/golang/go.git "$HOME/${{ matrix.go-tag }}"

    - name: Patch Go
      run: |
        go run ./cmd/iface_patch "$HOME/${{ matrix.go-tag }}"
        go run ./cmd/iface_patch -check "$HOME/${{ matrix.go-tag }}"

    - name: Rebuild Go
      run: cd "$HOME/${{ matrix.go-tag }}/src" && ./make.bash

    - name: Test ifacefuncval
      run: |
        export GOROOT="$HOME/${{ matrix.go-tag }}"
        export PATH="$GOROOT/bin:$PATH"
        go clean -cache
        go test -v -tags goplus.ifacefuncval .
        go test -v -tags goplus.ifacefuncval fmt sort
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          GOARCH=386 go test -v -tags goplus.ifacefuncval .
          GOARCH=386 go test -v -tags goplus.ifacefuncval fmt sort
        fi

  Test-Windows:
    strategy:
      matrix:
        go-version: [1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x, 1.27.x]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Build-linkname
      if: ${{ matrix.go-version >= '1.23' }}
      run: go build -tags linknamefix -ldflags=-checklinkname=0 -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Test-linkname
      if: ${{ matrix.go-version >= '1.23' }}
      run: go test -race -v -tags linknamefix -ldflags="-checklinkname=0"

    - name: Test-386
      run: |
        set GOARCH=386 
        go test -v .
